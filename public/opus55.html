<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg', XL = 'http://www.w3.org/1999/xlink';

  const srand = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
  const TILE = 800;

  // ---------- Modes ----------
  const MODES = {
    sunny: { label: '☀️ 阳光沙滩', vars: {
        sky1: '#38bdf8', sky2: '#e0f2fe', sea1: '#0ea5e9', sea2: '#0369a1', wave1: '#7dd3fc', wave2: '#0284c7', foam: '#ffffff',
        sand1: '#fde68a', sand2: '#f5c451', board: '#c2793a', seam: '#8a4b1c', rail: '#7c3f12',
        trunk: '#8b5a2b', leaf: '#16a34a', leaf2: '#22c55e', cloud: '#ffffff', island: '#0e7490', islandLeaf: '#059669', tint: '#000000' },
      sun: [650, 92], sunColor: '#fef08a', amt: { sun: 1, moon: 0, stars: 0, rain: 0, bio: 0, refl: 0, lamp: 0, shades: 1, hat: 0, gull: 1, tint: 0 },

    sunset: { label: '🌅 椰林日落', vars: {
        sky1: '#e8668f', sky2: '#fed7aa', sea1: '#fb923c', sea2: '#9a3412', wave1: '#fdba74', wave2: '#c2410c', foam: '#ffedd5',
        sand1: '#fdba74', sand2: '#e8863a', board: '#9a4d22', seam: '#6b2f10', rail: '#5a250c',
        trunk: '#4a1d0c', leaf: '#3b1a0c', leaf2: '#55260f', cloud: '#fecdd3', island: '#7c2d12', islandLeaf: '#451a03', tint: '#f97316' },
      sun: [585, 252], sunColor: '#fde047', amt: { sun: 1, moon: 0, stars: 0, rain: 0, bio: 0, refl: 1, lamp: .35, shades: 1, hat: 0, gull: 1, tint: .1 },

        trunk: '#4a3420', leaf: '#166534', leaf2: '#15803d', cloud: '#94a3b8', island: '#334155', islandLeaf: '#1e3a2a', tint: '#0f172a' },
      sun: [650, 92], sunColor: '#cbd5e1', amt: { sun: 0, moon: 0, stars: 0, rain: 1, bio: 0, refl: 0, lamp: .75, shades: 0, hat: 1, gull: 0, tint: .22 },
      spray: '#bfdbfe' },
    night: { label: '🌌 荧光海夜', vars: {

        sand1: '#334155', sand2: '#1e293b', board: '#3b2a1e', seam: '#1c130c', rail: '#1c130c',
        trunk: '#1f2937', leaf: '#064e3b', leaf2: '#065f46', cloud: '#334155', island: '#0f172a', islandLeaf: '#052e16', tint: '#0b1030' },
      sun: [650, 330], sunColor: '#f8fafc', amt: { sun: 0, moon: 1, stars: 1, rain: 0, bio: 1, refl: 0, lamp: 1, shades: 0, hat: 0, gull: 0, tint: .32 },
      spray: '#67e8f9' },
  };
  const ORDER = ['sunny', 'sunset', 'rain', 'night'];
  let mode = 'sunny';
  const amt = { ...MODES.sunny.amt };
  const sunPos = [...MODES.sunny.sun];

  function setMode(m, instant) {
    mode = m;
    const conf = MODES[m];
    for (const k in conf.vars) svg.style.setProperty('--' + k, conf.vars[k]);
    set('sunDisc', 'fill', conf.sunColor);
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    document.body.style.background = conf.vars.sky1;
    if (instant) { Object.assign(amt, conf.amt); sunPos[0] = conf.sun[0]; sunPos[1] = conf.sun[1]; }
    nextStrike = time + rand(1.2, 3);
    if (reduced) render(0);
  }
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // ---------- Scenery ----------
  function tileLayer(layerId, tileId) {
    const layer = $(layerId);
    for (let k = -3; k <= 4; k++) {
      const u = el('use', { href: '#' + tileId, x: k * TILE }, layer);
      u.setAttributeNS(XL, 'xlink:href', '#' + tileId);
    }
    return layer;
  }

  // palm trees
  function leafPath(o, angDeg, len, w) {
    const a = angDeg * Math.PI / 180;
    const tip = [o[0] + Math.cos(a) * len, o[1] + Math.sin(a) * len + len * .38];
    const mid = [(o[0] + tip[0]) / 2, (o[1] + tip[1]) / 2 - len * .22];
    const nx = -Math.sin(a), ny = Math.cos(a);
    const c1 = [mid[0] - nx * w, mid[1] - ny * w], c2 = [mid[0] + nx * w * .5, mid[1] + ny * w * .5];
    return `M${P(o)} Q${P(c1)} ${P(tip)} Q${P(c2)} ${P(o)} Z`;
  }
  function palm(parent, x, base, s, flip) {
    const g = el('g', { transform: `translate(${x},${base}) scale(${flip ? -s : s},${s})` }, parent);
    const trunk = 'M0,0 C 6,-60 4,-120 30,-172';
    el('path', { d: trunk, fill: 'none', 'stroke-width': 15, 'stroke-linecap': 'round', class: 't', style: 'stroke:var(--trunk)' }, g);
    el('path', { d: trunk, fill: 'none', stroke: '#000', 'stroke-opacity': .22, 'stroke-width': 15, 'stroke-dasharray': '2.5 10' }, g);
    const top = [30, -172];
    [-168, -140, -112, -70, -38, -8, 24].forEach((ang, i) => {
      el('path', { d: leafPath(top, ang, 70 + (i % 3) * 8, 14), class: 't', style: `fill:var(${i % 2 ? '--leaf2' : '--leaf'})` }, g);
    });
    [[24, -164], [34, -162], [29, -156]].forEach(([cx, cy]) => el('circle', { cx, cy, r: 5.5, fill: '#6b3e1a' }, g));
  }
  const tp = $('tilePalms');
  palm(tp, 70, 404, 1, false);
  palm(tp, 470, 400, .82, true);
  palm(tp, 505, 404, .66, false);

  // sand decorations: shells, starfish, crab, umbrella
  const ts = $('tileSand');
  for (let i = 0; i < 26; i++) el('circle', { cx: srand(0, 800), cy: srand(398, 446), r: srand(.8, 1.8), fill: '#000', opacity: .12 }, ts);
  (() => { // starfish
    const g = el('g', { transform: 'translate(140,428) rotate(12)' }, ts);
    let d = '';
    for (let i = 0; i < 10; i++) { const r = i % 2 ? 3.2 : 8, a = -Math.PI / 2 + i * Math.PI / 5; d += (i ? 'L' : 'M') + (r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1); }
    el('path', { d: d + 'Z', fill: '#fb7185', stroke: '#be123c', 'stroke-width': .8 }, g);
  })();
  (() => { // crab
    const g = el('g', { transform: 'translate(420,432)' }, ts);
    el('path', { d: 'M-12,2 l-6,4 M-10,4 l-5,6 M12,2 l6,4 M10,4 l5,6', stroke: '#b91c1c', 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
    el('ellipse', { cx: 0, cy: 0, rx: 13, ry: 8, fill: '#ef4444' }, g);
    el('path', { d: 'M-10,-4 q-8,-10 -2,-14 M10,-4 q8,-10 2,-14', stroke: '#ef4444', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, g);
    el('circle', { cx: -12, cy: -18, r: 4, fill: '#ef4444' }, g); el('circle', { cx: 12, cy: -18, r: 4, fill: '#ef4444' }, g);
    el('circle', { cx: -4, cy: -7, r: 2, fill: '#0f172a' }, g); el('circle', { cx: 4, cy: -7, r: 2, fill: '#0f172a' }, g);
  })();
  (() => { // umbrella + towel
    const g = el('g', {}, ts);
    el('path', { d: 'M668,436 L716,436 L726,446 L676,446 Z', fill: '#38bdf8' }, g);
    el('path', { d: 'M684,436 L692,446 M700,436 L708,446', stroke: '#f8fafc', 'stroke-width': 4 }, g);
    el('line', { x1: 690, y1: 440, x2: 684, y2: 330, stroke: '#e5e7eb', 'stroke-width': 3 }, g);
    el('path', { d: 'M640,338 Q680,292 728,330 Q716,326 705,334 Q694,326 683,335 Q672,327 661,336 Q651,330 640,338 Z', fill: '#ef4444', stroke: '#b91c1c', 'stroke-width': 1 }, g);
    el('path', { d: 'M683,312 Q692,312 705,334 Q694,326 683,335 Z', fill: '#f8fafc' }, g);
    el('path', { d: 'M661,322 Q668,316 676,313 L672,327 L661,336 Z', fill: '#f8fafc' }, g);
  })();

  // boardwalk plank seams
  const tbd = $('tileBoard');
  for (let x = 0; x < TILE; x += 50) {
    el('line', { x1: x, y1: 454, x2: x, y2: 495, 'stroke-width': 3, class: 't', style: 'stroke:var(--seam)' }, tbd);
    el('circle', { cx: x + 6, cy: 460, r: 1.3, fill: '#000', opacity: .3 }, tbd);
    el('circle', { cx: x + 6, cy: 489, r: 1.3, fill: '#000', opacity: .3 }, tbd);
  }

  const layers = [
    [tileLayer('layerClouds', 'tileClouds'), .05, 6],
    [tileLayer('layerFar', 'tileFar'), .1, 0],
    [tileLayer('layerPalms', 'tilePalms'), .45, 0],
    [tileLayer('layerSand', 'tileSand'), .8, 0],
    [tileLayer('layerBoard', 'tileBoard'), 1, 0],
  ];

  // stars
  const stars = [];
  for (let i = 0; i < 130; i++) {
    stars.push({ n: el('circle', { cx: srand(-700, 1500), cy: srand(-500, 240), r: srand(.5, 1.6), fill: '#fff' }, $('stars')), s: srand(.8, 3), p: srand(0, 6.28) });
  }
  // gulls
  const gulls = [[230, 128, 0], [292, 146, 1.7], [700, 112, 3.1]].map(([x, y, ph]) => ({ n: el('path', {}, $('gulls')), x, y, ph }));
  // sunset reflection streaks
  const refl = [];
  for (let i = 0; i < 7; i++) refl.push(el('line', { 'stroke-width': 3 - i * .25 }, $('reflection')));
  // bioluminescent sparks
  const bio = [];
  for (let i = 0; i < 46; i++) bio.push({ n: el('circle', { r: srand(1, 2.4), fill: i % 3 ? '#67e8f9' : '#a7f3d0' }, $('bio')), x: srand(0, 800), y: srand(300, 392), p: srand(0, 6.28) });
  // rain
  const drops = [];
  for (let i = 0; i < 130; i++) drops.push({ n: el('line', { 'stroke-width': rand(1, 2.2).toFixed(1) }, $('rain')), x: rand(-50, 900), y: rand(-20, 500), len: rand(12, 26), v: rand(560, 820) });
  // spray particles
  const spray = [];
  for (let i = 0; i < 44; i++) spray.push({ n: el('circle', { r: 0 }, $('spray')), life: 0 });
  // speed lines
  const streaks = [];
  for (let i = 0; i < 14; i++) streaks.push({ n: el('line', { 'stroke-width': rand(1.5, 3) }, $('speedLines')), x: rand(0, 800), y: rand(120, 430), len: rand(40, 110) });

  // spokes
  function spokes(gid, cx, cy) {
    const g = $(gid);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * 2 * Math.PI, off = (i % 2 ? 1 : -1) * .4;
      el('line', { x1: cx + 7 * Math.cos(a + off), y1: cy + 7 * Math.sin(a + off), x2: cx + 74 * Math.cos(a), y2: cy + 74 * Math.sin(a), stroke: '#cbd5e1', 'stroke-width': 1.2 }, g);
    }
    el('circle', { cx: cx + 48, cy, r: 3.2, fill: '#f97316' }, g); // reflector
  }
  spokes('rearSpin', 250, 360);
  spokes('frontSpin', 530, 360);

  // ---------- Rider kinematics ----------
  const BB = [375, 375], CRANK = 32, GEAR = 19 / 8, WHEEL_R = 85;
  const HIP = [350, 219], THIGH = 92, SHIN = 100;
  const SHOULDER_N = [393, 170], SHOULDER_F = [402, 160];
  const GRIP_N = [517, 222], GRIP_F = [508, 219], UPPER = 78, FORE = 72;

  function ik(o, t, l1, l2, dir) {
    const dx = t[0] - o[0], dy = t[1] - o[1], d = Math.hypot(dx, dy);
    const dc = Math.min(Math.max(d, Math.abs(l1 - l2) + .5), l1 + l2 - .01);
    const a = Math.atan2(dy, dx);
    const al = Math.acos(Math.min(1, Math.max(-1, (l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc))));
    const ang = a + dir * al;
    const j = [o[0] + l1 * Math.cos(ang), o[1] + l1 * Math.sin(ang)];
    const ex = t[0] - j[0], ey = t[1] - j[1], e = Math.hypot(ex, ey) || 1;
    return [j, [j[0] + ex / e * l2, j[1] + ey / e * l2]];
  }

  function leg(hip, pedal, near) {
    const [knee, ankle] = ik(hip, [pedal[0] - 2, pedal[1] - 10], THIGH, SHIN, -1);
    const thigh = `M${P(hip)} L${P(knee)}`, shin = `M${P(knee)} L${P(ankle)}`;
    const px = pedal[0], py = pedal[1] - 1, f = n => n.toFixed(1);
    const foot = `M${P(ankle)} L${f(px + 17)},${f(py - 1)} Q${f(px + 13)},${f(py + 2)} ${f(px + 8)},${f(py + 1)} ` +
      `Q${f(px + 4)},${f(py + 3.5)} ${f(px - 1)},${f(py + 1.5)} Q${f(px - 6)},${f(py + 3)} ${f(px - 10)},${f(py)} Z`;
    if (near) {
      set('nearThighO', 'd', thigh); set('nearThigh', 'd', thigh);
      set('nearShinO', 'd', shin); set('nearShin', 'd', shin); set('nearFoot', 'd', foot);
    } else {
      set('farThigh', 'd', thigh); set('farShin', 'd', shin); set('farFoot', 'd', foot);
    }
  }

  function wing(pathId, primId, shoulder, grip, lineId) {
    const [elbow, wrist] = ik(shoulder, grip, UPPER, FORE, -1);
    const n1 = [-(elbow[1] - shoulder[1]) / UPPER, (elbow[0] - shoulder[0]) / UPPER];
    const n2 = [-(wrist[1] - elbow[1]) / FORE, (wrist[0] - elbow[0]) / FORE];
    const nA = [(n1[0] + n2[0]) / 2, (n1[1] + n2[1]) / 2];
    const off = (p, n, k) => [p[0] + n[0] * k, p[1] + n[1] * k];
    const sTop = off(shoulder, n1, -10), eTop = off(elbow, nA, -7), wTop = off(wrist, n2, -4);
    const wBot = off(wrist, n2, 8), eBot = off(elbow, nA, 26), sBot = off(shoulder, n1, 30);
    let d = `M${P(sTop)} Q${P(off([(sTop[0] + eTop[0]) / 2, (sTop[1] + eTop[1]) / 2], n1, -8))} ${P(eTop)} L${P(wTop)} L${P(wBot)}`;
    const seg = (a, b, n, k) => {
      for (let i = 1; i <= k; i++) {
        const tm = (i - .5) / k, t1 = i / k;
        d += ` Q${P(off([a[0] + (b[0] - a[0]) * tm, a[1] + (b[1] - a[1]) * tm], n, 6))} ${P([a[0] + (b[0] - a[0]) * t1, a[1] + (b[1] - a[1]) * t1])}`;
      }
    };
    seg(wBot, eBot, n2, 3);
    seg(eBot, sBot, n1, 3);
    d += ` Q${P([shoulder[0] - n1[0] * 4 - (elbow[0] - shoulder[0]) * .25, shoulder[1] - n1[1] * 4 - (elbow[1] - shoulder[1]) * .25])} ${P(sTop)} Z`;
    set(pathId, 'd', d);
    if (lineId) set(lineId, 'd', `M${P(off(shoulder, n1, 12))} Q${P(off(elbow, nA, 10))} ${P(off(wrist, n2, 2))}`);
    const g = $(primId);
    if (!g.childElementCount) for (let i = 0; i < 4; i++) el('ellipse', {}, g);
    const base = Math.atan2(wrist[1] - elbow[1], wrist[0] - elbow[0]) * 180 / Math.PI;
    [...g.children].forEach((fe, i) => {
      const rot = base + 20 + i * 22, r = rot * Math.PI / 180;
      const cx = (wrist[0] + Math.cos(r) * 9).toFixed(2), cy = (wrist[1] + Math.sin(r) * 9).toFixed(2);
      fe.setAttribute('cx', cx); fe.setAttribute('cy', cy);
      fe.setAttribute('rx', 12 - i * 1.2); fe.setAttribute('ry', 3.6);
      fe.setAttribute('transform', `rotate(${rot.toFixed(1)} ${cx} ${cy})`);
    });
  }

  // ---------- Full-screen framing ----------
  const BOX = { x: 60, y: 40, w: 680, h: 460 };
  const vb = { x: 0, y: 0, w: 800, h: 500 };
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    const T = document.querySelector('.top').getBoundingClientRect().bottom + 6;
    const B = H - $('panel').getBoundingClientRect().top + 4;
    const availH = Math.max(H - T - B, H * .35);
    const sc = Math.min(W / BOX.w, availH / BOX.h);
    vb.w = W / sc; vb.h = H / sc;
    vb.x = BOX.x - (vb.w - BOX.w) / 2;
    vb.y = BOX.y - (T + (availH - BOX.h * sc) / 2) / sc;
    svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
    if (reduced) render(0);
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) { const ro = new ResizeObserver(fit); ro.observe($('panel')); ro.observe(document.querySelector('.top')); }

  // ---------- Simulation state ----------
  const slider = $('cadence');
  let base = parseFloat(slider.value), cur = base, turbo = false;
  let dist = 40, time = 0, last = null;
  let nextStrike = 4, strikeAt = -10;
  let lastKmh = -1;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function wavePath(y0, amp, len, ph, bottom) {
    const x0 = Math.floor((vb.x - 20) / 10) * 10, x1 = vb.x + vb.w + 20;
    let d = `M${x0},${bottom}`;
    for (let x = x0; x <= x1 + 10; x += 10) {
      const y = y0 + amp * Math.sin(x / len * 6.283 + ph) + amp * .35 * Math.sin(x / (len * .47) * 6.283 + ph * 1.7);
      d += ` L${x},${y.toFixed(1)}`;
    }
    return d + ` L${x1 + 10},${bottom} Z`;
  }

  function strike() {
    let x = rand(vb.x + 60, vb.x + vb.w - 60), y = vb.y, d = `M${x.toFixed(0)},${y.toFixed(0)}`;
    let branch = '';
    while (y < 250) {
      y += rand(18, 34); x += rand(-28, 28);
      d += ` L${x.toFixed(0)},${y.toFixed(0)}`;
      if (!branch && y > vb.y + 90 && Math.random() < .5) {
        let bx = x, by = y; branch = ` M${bx.toFixed(0)},${by.toFixed(0)}`;
        for (let k = 0; k < 3; k++) { bx += rand(10, 30) * (Math.random() < .5 ? -1 : 1); by += rand(16, 26); branch += ` L${bx.toFixed(0)},${by.toFixed(0)}`; }
      }
    }
    set('bolt', 'd', d + branch);
    strikeAt = time;
    setTimeout(thunder, rand(450, 1300));
  }

  function render(dt) {
    // ease towards the current mode's look
    const k = dt ? Math.min(1, dt * 2.6) : 1;
    const tgt = MODES[mode].amt;
    for (const key in tgt) amt[key] += (tgt[key] - amt[key]) * k;
    sunPos[0] += (MODES[mode].sun[0] - sunPos[0]) * k * .8;
    sunPos[1] += (MODES[mode].sun[1] - sunPos[1]) * k * .8;

    const target = turbo ? base * 2.3 : base;
    cur += (target - cur) * (dt ? Math.min(1, dt * 3.5) : 1);
    const px = cur * 120;                         // scene px per second
    dist += px * dt;
    time += dt;
    const boost = Math.max(0, Math.min(1, (cur - base) / (base * 1.2)));
    const kmh = Math.round(cur * 15);
    if (kmh !== lastKmh) { $('kmh').textContent = kmh; lastKmh = kmh; }

    // parallax
    layers.forEach(([g, f, drift]) => g.setAttribute('transform', `translate(${(-((dist * f + time * drift) % TILE)).toFixed(2)},0)`));

    // sky bodies
    $('sun').setAttribute('transform', `translate(${sunPos[0].toFixed(1)},${sunPos[1].toFixed(1)})`);
    $('sun').style.opacity = amt.sun.toFixed(3);
    $('moon').style.opacity = amt.moon.toFixed(3);
    if (amt.stars > .01) stars.forEach(s => s.n.setAttribute('opacity', (amt.stars * (.35 + .65 * Math.abs(Math.sin(time * s.s + s.p)))).toFixed(2)));
    else if (amt.stars <= .01 && stars[0].n.getAttribute('opacity') !== '0') stars.forEach(s => s.n.setAttribute('opacity', 0));

    $('gulls').style.opacity = amt.gull.toFixed(3);
    if (amt.gull > .01) gulls.forEach(g => {
      const x = g.x + 22 * Math.sin(time * .35 + g.ph), y = g.y + 6 * Math.sin(time * .9 + g.ph);
      const f = 7 * Math.sin(time * 7 + g.ph * 3);
      g.n.setAttribute('d', `M${(x - 13).toFixed(1)},${(y + f * .3).toFixed(1)} Q${(x - 6).toFixed(1)},${(y - f).toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)} Q${(x + 6).toFixed(1)},${(y - f).toFixed(1)} ${(x + 13).toFixed(1)},${(y + f * .3).toFixed(1)}`);
    });

    // sea
    const wph = dist * .012 + time * 1.1;
    set('waveBack', 'd', wavePath(322, 5, 130, wph * .6, 400));
    set('waveFront', 'd', wavePath(362, 7, 160, wph, 400));
    const fx0 = Math.floor((vb.x - 20) / 20) * 20;
    let fd = `M${fx0},393`;
    for (let x = fx0; x <= vb.x + vb.w + 40; x += 20) fd += ` L${x},${(392 + 2.2 * Math.sin(x / 70 + time * 2.2)).toFixed(1)}`;
    set('foam', 'd', fd);
    set('foam', 'stroke-dashoffset', (dist * .9 % 23).toFixed(1));

    $('reflection').style.opacity = amt.refl.toFixed(3);
    if (amt.refl > .01) refl.forEach((n, i) => {
      const y = 264 + i * 11, w = (34 - i * 3.5) * (.75 + .25 * Math.sin(time * 3 + i * 1.3));
      n.setAttribute('x1', (sunPos[0] - w).toFixed(1)); n.setAttribute('x2', (sunPos[0] + w).toFixed(1));
      n.setAttribute('y1', y); n.setAttribute('y2', y);
    });

    $('bio').style.opacity = amt.bio.toFixed(3);
    if (amt.bio > .01) bio.forEach(b => {
      const x = vb.x + (((b.x / 800 * vb.w - dist * .5 - time * 6) % vb.w) + vb.w) % vb.w;
      b.n.setAttribute('cx', x.toFixed(1));
      b.n.setAttribute('cy', (b.y + 3 * Math.sin(time * 1.6 + b.p)).toFixed(1));
      b.n.setAttribute('opacity', (.25 + .75 * Math.max(0, Math.sin(time * 2.2 + b.p))).toFixed(2));
    });

    // bike & rider
    const wheelA = dist / WHEEL_R, th = wheelA / GEAR, wDeg = wheelA * 180 / Math.PI;
    const bump = .7 * Math.max(0, Math.sin(dist * Math.PI / 50)) ** 8 * Math.min(1.5, cur);
    const wrap = `translate(30,${(32 - bump).toFixed(2)}) scale(.94)`;
    set('rigWrap', 'transform', wrap);
    set('beamWrap', 'transform', wrap);
    set('rearSpin', 'transform', `rotate(${wDeg.toFixed(2)} 250 360)`);
    set('frontSpin', 'transform', `rotate(${wDeg.toFixed(2)} 530 360)`);
    const blur = Math.min(.45, Math.max(0, cur - 1.6) * .18);
    set('rearBlur', 'opacity', blur.toFixed(2)); set('frontBlur', 'opacity', blur.toFixed(2));
    set('ring', 'transform', `rotate(${(th * 180 / Math.PI).toFixed(2)} 375 375)`);
    set('chain', 'stroke-dashoffset', (-(th * 19) % 5.4).toFixed(2));

    const near = [BB[0] + CRANK * Math.cos(th), BB[1] + CRANK * Math.sin(th)];
    const far = [BB[0] - CRANK * Math.cos(th), BB[1] - CRANK * Math.sin(th)];
    set('nearCrank', 'x1', BB[0]); set('nearCrank', 'y1', BB[1]); set('nearCrank', 'x2', near[0]); set('nearCrank', 'y2', near[1]);
    set('farCrank', 'x1', BB[0]); set('farCrank', 'y1', BB[1]); set('farCrank', 'x2', far[0]); set('farCrank', 'y2', far[1]);
    set('nearPedal', 'x', near[0] - 8.5); set('nearPedal', 'y', near[1] - 2.5);
    set('farPedal', 'x', far[0] - 8); set('farPedal', 'y', far[1] - 2.5);

    const bob = 2.2 * Math.sin(2 * th);
    const rock = .9 * Math.sin(th) + boost * 4;        // leans into the wind in turbo
    set('body', 'transform', `translate(0,${bob.toFixed(2)}) rotate(${rock.toFixed(2)} 340 222)`);
    set('head', 'transform', `rotate(${(1.8 * Math.sin(2 * th + .9) - boost * 3).toFixed(2)} 430 140)`);
    const flutter = 1.6 + boost * 4 + amt.rain * 1.5;
    set('pouch', 'transform', `rotate(${(flutter * Math.sin(time * (6 + boost * 18))).toFixed(2)} 458 118)`);
    $('shades').style.opacity = amt.shades.toFixed(3);
    $('hat').style.opacity = amt.hat.toFixed(3);

    const rk = rock * Math.PI / 180, cr = Math.cos(rk), sr = Math.sin(rk);
    const W = p => { const x = p[0] - 340, y = p[1] - 222; return [340 + x * cr - y * sr, 222 + x * sr + y * cr + bob]; };
    const hip = W(HIP);
    leg([hip[0] + 4, hip[1] - 4], far, false);
    leg(hip, near, true);
    wing('farWing', 'farPrimaries', W(SHOULDER_F), GRIP_F, null);
    wing('nearWing', 'nearPrimaries', W(SHOULDER_N), GRIP_N, 'nearWingLine');

    // lamp
    set('beam', 'opacity', (amt.lamp * (.92 + .08 * Math.sin(time * 9))).toFixed(3));
    set('lampHalo', 'opacity', (amt.lamp * .9).toFixed(3));
    set('tint', 'opacity', amt.tint.toFixed(3));

    // sand / water spray from the rear tyre
    if (dt) {
      let emit = (Math.max(0, cur - .9) * 18 + boost * 55) * dt;
      for (const p of spray) {
        if (p.life <= 0 && emit >= Math.random()) {
          emit -= 1;
          p.life = p.max = rand(.45, .9);
          p.x = 262 + rand(-4, 4); p.y = 449;
          p.vx = -rand(50, 150) - cur * 30; p.vy = -rand(50, 150) * (.6 + boost);
          p.n.setAttribute('r', rand(1.1, 2.6).toFixed(1));
          p.n.setAttribute('fill', MODES[mode].spray);
        }
        if (p.life > 0) {
          p.life -= dt; p.vy += 420 * dt; p.x += p.vx * dt; p.y = Math.min(452, p.y + p.vy * dt);
          p.n.setAttribute('cx', p.x.toFixed(1)); p.n.setAttribute('cy', p.y.toFixed(1));
          p.n.setAttribute('opacity', Math.max(0, p.life / p.max).toFixed(2));
        } else p.n.setAttribute('opacity', 0);
      }
    }

    // turbo streaks
    $('speedLines').style.opacity = (boost * .6).toFixed(3);
    if (boost > .01) streaks.forEach(s => {
      s.x -= (900 + px) * dt;
      if (s.x + s.len < vb.x) { s.x = vb.x + vb.w + rand(0, 200); s.y = rand(Math.max(vb.y + 60, 0), 430); s.len = rand(40, 110); }
      s.n.setAttribute('x1', s.x.toFixed(1)); s.n.setAttribute('x2', (s.x + s.len).toFixed(1));
      s.n.setAttribute('y1', s.y.toFixed(1)); s.n.setAttribute('y2', s.y.toFixed(1));
    });

    // rain & lightning
    $('rain').style.opacity = (amt.rain * .85).toFixed(3);
    if (amt.rain > .01) {
      const slant = 120 + px * .9, bottom = vb.y + vb.h;
      drops.forEach(d => {
        d.y += d.v * dt; d.x -= slant * dt;
        if (d.y > bottom || d.x < vb.x - 40) { d.y = vb.y - rand(10, 60); d.x = vb.x + rand(0, vb.w + slant * 1.2); }
        const sx = slant / d.v * d.len;
        d.n.setAttribute('x1', d.x.toFixed(1)); d.n.setAttribute('y1', d.y.toFixed(1));
        d.n.setAttribute('x2', (d.x - sx).toFixed(1)); d.n.setAttribute('y2', (d.y + d.len).toFixed(1));
      });
    }
    if (mode === 'rain' && amt.rain > .6 && time > nextStrike && !reduced) { strike(); nextStrike = time + rand(4, 9); }
    const s = time - strikeAt;
    const fl = s < .06 ? .7 : s < .12 ? .08 : s < .2 ? .8 : s < .45 ? .8 * (1 - (s - .2) / .25) : 0;
    set('flash', 'opacity', fl.toFixed(3));
    set('bolt', 'opacity', s < .45 ? (1 - s / .45).toFixed(3) : 0);
  }

  // ---------- Sound ----------
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function ding() {
    const c = audio(); if (!c) return;
    const t0 = c.currentTime;
    [[2093, 0], [2637, .12]].forEach(([f, delay]) => [[1, .22, .8], [2.76, .05, .3]].forEach(([m, peak, dur]) => {
      const o = c.createOscillator(), g = c.createGain(), st = t0 + delay;
      o.frequency.value = f * m;
      g.gain.setValueAtTime(.0001, st);
      g.gain.exponentialRampToValueAtTime(peak, st + .005);
      g.gain.exponentialRampToValueAtTime(.0001, st + dur);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + dur + .05);
    }));
  }
  function thunder() {
    const c = actx; if (!c || c.state !== 'running' || mode !== 'rain') return;
    const len = Math.floor(c.sampleRate * 2.4), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let v = 0;
    for (let i = 0; i < len; i++) { v = (v + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = v * 3.5; }
    const src = c.createBufferSource(), lp = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime;
    src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 170;
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.6, t0 + .12); g.gain.exponentialRampToValueAtTime(.0001, t0 + 2.3);
    src.connect(lp); lp.connect(g); g.connect(c.destination); src.start();
  }

  // ---------- Controls ----------
  function ringBell() {
    ding();
    const b = $('bell'), bub = $('bubble');
    b.classList.remove('ring'); bub.classList.remove('pop');
    void b.getBoundingClientRect();
    b.classList.add('ring'); bub.classList.add('pop');
  }
  $('bell').addEventListener('click', ringBell);
  $('bellBtn').addEventListener('click', ringBell);
  slider.addEventListener('input', () => { base = parseFloat(slider.value); if (reduced) { cur = base; render(0); } });

  const tb = $('turbo');
  const turboOn = e => { if (e) e.preventDefault(); turbo = true; tb.classList.add('held'); audio(); };
  const turboOff = () => { turbo = false; tb.classList.remove('held'); };
  tb.addEventListener('pointerdown', e => { tb.setPointerCapture && tb.setPointerCapture(e.pointerId); turboOn(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => tb.addEventListener(ev, turboOff));
  tb.addEventListener('keydown', e => { if (e.key === 'Enter') turboOn(e); });
  tb.addEventListener('keyup', e => { if (e.key === 'Enter') turboOff(); });
  window.addEventListener('blur', turboOff);
  window.addEventListener('keydown', e => {
    if (e.target === slider) return;
    if (e.code === 'Space') { turboOn(e); }
    else if (e.key === 'b' || e.key === 'B') { if (!e.repeat) ringBell(); }
    else if (e.key >= '1' && e.key <= '4') setMode(ORDER[+e.key - 1]);
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') turboOff(); });

  // ---------- Loop ----------
  setMode('sunny', true);
  fit();
  render(0);
  if (!reduced) {
    const tick = t => {
      const dt = last === null ? 0 : Math.min(.05, (t - last) / 1000);
      last = t;
      render(dt);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
